name: Quality checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede earlier jobs; PR and dev pushes retain independent full QA gates.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static and browser regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural tests and embedded Python compile check
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install browser test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests (local functions, no SymPy CDN)
        run: python tests/smoke_browser.py
      - name: Task-first workspace browser regression
        run: python tests/smoke_workspace_tasks.py
      - name: Per-workspace task restoration browser regression
        run: python tests/smoke_workspace_task_restore.py
      - name: Compact workspace selector functional and mobile regression
        run: python tests/smoke_compact_tasks.py
      - name: Calculator and Editor action grouping regression
        run: python tests/smoke_action_groups.py
      - name: Graph panel grouping and export regression
        run: python tests/smoke_graph_panels.py
      - name: Project migration and rollback browser regression
        run: python tests/smoke_project_schema.py
      - name: CSV/JSON graph import smoke test
        run: python tests/smoke_graph_import.py
      - name: Graph axis, 3D surfaces, pan/zoom and draft preservation regression
        run: python tests/smoke_graph_navigation.py
      - name: Data Tables action-menu keyboard, dismissal and export regression
        run: python tests/smoke_data_toolbar_menus.py
      - name: Workspace navigation keyboard, focus and responsive regression
        run: python tests/smoke_workspace_navigation.py
      - name: Spreadsheet and chart regression
        run: python tests/smoke_data_tables.py
      - name: Spreadsheet structural reference regression
        run: python tests/smoke_sheet_references.py
      - name: Spreadsheet sort and reference regression
        run: python tests/smoke_sheet_sort_references.py
      - name: Spreadsheet range deletion regression
        run: python tests/smoke_sheet_range_delete.py
      - name: Nested IF lazy spreadsheet evaluation regression
        run: python tests/smoke_sheet_nested_if.py
      - name: Advanced math + UI regression
        run: python tests/smoke_advanced_math.py
      - name: Curve-fit residual diagnostics and CSV export regression
        run: python tests/smoke_fit_diagnostics.py
      - name: Symbolic limit reference and UI regression
        run: python tests/smoke_symbolic_limits.py
      - name: Symbolic assumptions reference, worker and project regression
        run: python tests/smoke_symbolic_assumptions.py
      - name: Symbolic ODE initial-condition reference and browser regression
        run: python tests/smoke_symbolic_ode_ics.py
      - name: High-precision decimal reference and browser regression
        run: python tests/smoke_precision.py
      - name: High-precision expression reference and browser regression
        run: python tests/smoke_precision_expression.py
      - name: High-precision 599-digit exact quotient and input-boundary regression
        run: python tests/smoke_precision_large_quotient.py
      - name: Numerical solver, filtering and Python worker smoke
        run: python tests/smoke_numerical_data.py
      - name: Adaptive Simpson quadrature numeric and UI regression
        run: python tests/smoke_quadrature_adaptive.py
      - name: Linear interpolation reference and browser integration regression
        run: python tests/smoke_interpolation_linear.py
      - name: Shape-preserving cubic interpolation numerical and browser regression
        run: python tests/smoke_interpolation_pchip.py
      - name: Barycentric polynomial interpolation reference and browser regression
        run: python tests/smoke_interpolation_barycentric.py
      - name: Golden-section scalar minimization reference and browser regression
        run: python tests/smoke_minimize_golden.py
      - name: Brent-Dekker bracketed root regression
        run: python tests/smoke_root_brent.py
      - name: XLSX offline export ZIP and browser regression
        run: python tests/smoke_xlsx_export.py
      - name: XLSX secure import and transactional round-trip regression
        run: python tests/smoke_xlsx_import.py
      - name: XLSX formula token boundary regression
        run: python tests/smoke_xlsx_formula_tokens.py
      - name: Context menus and programmer calculator smoke test
        run: python tests/smoke_context_actions.py
      - name: Graph styles, table zoom and calculator notation
        run: python tests/smoke_visual_options.py
      - name: Matrix calculator numeric and UI regression
        run: python tests/smoke_matrix.py
      - name: Matrix binary arithmetic regression
        run: python tests/smoke_matrix_arithmetic.py
      - name: Matrix RREF and rank regression
        run: python tests/smoke_matrix_rref.py
      - name: Matrix Ax=b linear-system regression
        run: python tests/smoke_matrix_solve.py
      - name: Matrix pivoted LU decomposition regression
        run: python tests/smoke_matrix_lu.py
      - name: Matrix thin QR decomposition regression
        run: python tests/smoke_matrix_qr.py
      - name: Matrix least-squares numeric and UI regression
        run: python tests/smoke_matrix_least_squares.py
      - name: Symmetric 2x2/3x3 matrix eigenanalysis reference and UI regression
        run: python tests/smoke_matrix_eigen.py
      - name: Real 2x2 SVD reference, rank, reconstruction and browser regression
        run: python tests/smoke_matrix_svd.py
      - name: Offline radix-2 FFT numerical, UI, table and graph regression
        run: python tests/smoke_fft.py
      - name: FFT physical-frequency Hz and sample-rate UI regression
        run: python tests/smoke_fft_sample_rate.py
      - name: FFT frequency resolution, Nyquist and validation regression
        run: python tests/smoke_fft_frequency_metadata.py
      - name: FFT periodic Hann window, amplitude and UI regression
        run: python tests/smoke_fft_window.py
      - name: Python custom function composition regression
        run: python tests/smoke_python_compose.py
      - name: RK4 initial-value solver numeric and UI regression
        run: python tests/smoke_ode.py
      - name: Adaptive RK45 numerical and UI regression
        run: python tests/smoke_ode_adaptive.py
      - name: Coupled two-state RK4 reference and UI regression
        run: python tests/smoke_ode_system.py
