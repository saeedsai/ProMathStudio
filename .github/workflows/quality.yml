      - name: High-precision expression reference and browser regression
        run: python tests/smoke_precision_expression.py
      - name: High-precision 599-digit exact quotient and input-boundary regression
        run: python tests/smoke_precision_large_quotient.py
      - name: Numerical solver, filtering and Python worker smoke
        run: python tests/smoke_numerical_data.py
      - name: Adaptive Simpson quadrature numeric and UI regression
        run: python tests/smoke_quadrature_adaptive.py
      - name: Linear interpolation reference and browser integration regression
        run: python tests/smoke_interpolation_linear.py
      - name: Shape-preserving cubic interpolation numerical and browser regression
        run: python tests/smoke_interpolation_pchip.py
      - name: Barycentric polynomial interpolation reference and browser regression
        run: python tests/smoke_interpolation_barycentric.py
      - name: Golden-section scalar minimization reference and browser regression
        run: python tests/smoke_minimize_golden.py
      - name: Brent-Dekker bracketed root regression
        run: python tests/smoke_root_brent.py
      - name: XLSX offline export ZIP and browser regression
        run: python tests/smoke_xlsx_export.py
      - name: XLSX secure import and transactional round-trip regression
        run: python tests/smoke_xlsx_import.py
      - name: XLSX formula token boundary regression
        run: python tests/smoke_xlsx_formula_tokens.py
      - name: Context menus and programmer calculator smoke test
        run: python tests/smoke_context_actions.py
      - name: Quoted spreadsheet clipboard TSV and transactional paste regression
        run: python tests/smoke_sheet_tsv_clipboard.py
      - name: Graph styles, table zoom and calculator notation
        run: python tests/smoke_visual_options.py
      - name: Matrix calculator numeric and UI regression
