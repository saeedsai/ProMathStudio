name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Static and browser regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural tests and embedded Python compile check
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install browser test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests (local functions, no SymPy CDN)
        run: python tests/smoke_browser.py
