name: Quality checks

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# New commits supersede earlier jobs; PR and dev pushes retain independent full QA gates.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static and browser regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Structural tests and embedded Python compile check
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Install browser test requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Browser smoke tests (local functions, no SymPy CDN)
        run: python tests/smoke_browser.py
      - name: Task-first workspace browser regression
        run: python tests/smoke_workspace_tasks.py
      - name: Per-workspace task restoration browser regression
        run: python tests/smoke_workspace_task_restore.py
      - name: Compact workspace selector functional and mobile regression
        run: python tests/smoke_compact_tasks.py
      - name: Calculator and Editor action grouping regression
        run: python tests/smoke_action_groups.py
      - name: Graph panel grouping and export regression
        run: python tests/smoke_graph_panels.py
      - name: Project migration and rollback browser regression
        run: python tests/smoke_project_schema.py
      - name: CSV/JSON graph import smoke test
        run: python tests/smoke_graph_import.py
      - name: Graph axis, 3D surfaces, pan/zoom and draft preservation regression
        run: python tests/smoke_graph_navigation.py
      - name: Data Tables action-menu keyboard, dismissal and export regression
        run: python tests/smoke_data_toolbar_menus.py
      - name: Data Tables menu traversal and quick-action focus regression
        run: python tests/smoke_data_menu_navigation.py
      - name: Data Tables column filter row alignment and search/sort regression
        run: python tests/smoke_data_column_filter_alignment.py
      - name: Workspace navigation keyboard, focus and responsive regression
        run: python tests/smoke_workspace_navigation.py
      - name: Shared Symbols palette Solver/2D/3D insertion and focus regression
        run: python tests/smoke_shared_symbols.py
      - name: Graph palette caret, draft isolation and responsive browser regression
        run: python tests/smoke_graph_symbol_caret.py
      - name: Graph numeric palette compatibility and Equation notation regression
        run: python tests/smoke_graph_palette_validity.py
      - name: Graph numeric root, fraction, factorial and mobile plotting regression
        run: python tests/smoke_graph_palette_expansion.py
      - name: Combined Equation Editor and Symbolic Solver browser regression
        run: python tests/smoke_equation_combined.py
      - name: Equation tool-family grouping and mobile browser regression
        run: python tests/smoke_equation_task_groups.py
      - name: Equation CAS accessible announcements, keyboard focus and mobile regression
        run: python tests/smoke_equation_accessibility.py
      - name: Spreadsheet and chart regression
        run: python tests/smoke_data_tables.py
      - name: Data Tables Functions & Code Library insertion and no-auto-run browser regression
        run: python tests/smoke_data_code_library.py
      - name: Data Tables saved snippet persistence, rename and delete browser regression
        run: python tests/smoke_data_saved_snippets.py
      - name: Data Tables full saved-snippet inspection, escaping and responsive keyboard regression
        run: python tests/smoke_data_snippet_inspection.py
      - name: Data Tables saved snippet JSON import/export and rollback browser regression
        run: python tests/smoke_data_snippet_interchange.py
      - name: Data Tables snippet import preview, cancel and conflict browser regression
        run: python tests/smoke_data_snippet_preview.py
      - name: Data Tables JSON export duplicate-header and lossless CSV regression
        run: python tests/smoke_data_json_duplicate_headers.py
      - name: CSV and TSV explicit empty-row import/export and rollback regression
        run: python tests/smoke_csv_empty_records.py
      - name: Data Tables formula-source CSV round-trip browser regression
        run: python tests/smoke_data_formula_source_csv.py
      - name: Data Tables TSV ambiguous-delimiter export and import browser regression
        run: python tests/smoke_data_tsv_delimiter.py
      - name: JSON record schema consistency, Unicode and transactional import regression
        run: python tests/smoke_json_record_schema.py
      - name: Single-column CSV TSV JSON Data Tables and strict Graph XY browser regression
        run: python tests/smoke_data_single_column.py
      - name: Data Tables CSV TSV JSON import preview, confirmation and rollback regression
        run: python tests/smoke_data_import_preview.py
      - name: Indexed Data Tables join ordering, limits and rollback regression
        run: python tests/smoke_data_join_index.py
      - name: Spreadsheet structural reference regression
        run: python tests/smoke_sheet_references.py
      - name: Spreadsheet sort and reference regression
        run: python tests/smoke_sheet_sort_references.py
      - name: Spreadsheet range deletion regression
        run: python tests/smoke_sheet_range_delete.py
      - name: Nested IF lazy spreadsheet evaluation regression
        run: python tests/smoke_sheet_nested_if.py
      - name: Data Tables MEDIAN and reference boundary regression
        run: python tests/smoke_sheet_median.py
      - name: Nested spreadsheet aggregate reference and library browser regression
        run: python tests/smoke_sheet_nested_aggregates.py
      - name: Nested spreadsheet custom function and aggregate composition regression
        run: python tests/smoke_sheet_custom_composition.py
      - name: Spreadsheet built-in name priority and finite aggregate numeric hardening regression
        run: python tests/smoke_sheet_numeric_hardening.py
      - name: Advanced math + UI regression
        run: python tests/smoke_advanced_math.py
      - name: Curve-fit residual diagnostics and CSV export regression
        run: python tests/smoke_fit_diagnostics.py
      - name: Symbolic limit reference and UI regression
        run: python tests/smoke_symbolic_limits.py
      - name: Symbolic assumptions reference, worker and project regression
        run: python tests/smoke_symbolic_assumptions.py
      - name: Symbolic ODE initial-condition reference and browser regression
        run: python tests/smoke_symbolic_ode_ics.py
      - name: High-precision decimal reference and browser regression
