      - name: Matrix least-squares numeric and UI regression
        run: python tests/smoke_matrix_least_squares.py
      - name: Symmetric 2x2/3x3 matrix eigenanalysis reference and UI regression
        run: python tests/smoke_matrix_eigen.py
      - name: Real 2x2 SVD reference, rank, reconstruction and browser regression
        run: python tests/smoke_matrix_svd.py
      - name: Moore-Penrose 2x2 pseudoinverse reference and browser regression
        run: python tests/smoke_matrix_pseudoinverse.py
      - name: Rectangular 3x2 Moore-Penrose pseudoinverse numerical and browser regression
        run: python tests/smoke_matrix_pseudoinverse_rectangular.py
      - name: Wide 2x3 Moore-Penrose pseudoinverse numerical and browser regression
        run: python tests/smoke_matrix_pseudoinverse_wide.py
      - name: Matrix near-dependent QR pseudoinverse and conditioning regression
        run: python tests/smoke_matrix_conditioning.py
      - name: Matrix 2x2 pseudoinverse conditioning and responsive UI regression
        run: python tests/smoke_matrix_2x2_condition.py
      - name: Matrix 3x3 Jacobi pseudoinverse reference and responsive UI regression
        run: python tests/smoke_matrix_pseudoinverse_3x3.py
      - name: Matrix 3x3 conditioning advisory, reference and responsive UI regression
        run: python tests/smoke_matrix_3x3_condition_advisory.py
      - name: Matrix decimal-only validation, error recovery and mobile browser regression
        run: python tests/smoke_matrix_decimal_input.py
      - name: Matrix right-hand side decimal validation and browser recovery regression
        run: python tests/smoke_matrix_rhs_decimal.py
      - name: Matrix tiny nonzero numeric display and browser regression
        run: python tests/smoke_matrix_small_nonzero.py
      - name: Offline radix-2 FFT numerical, UI, table and graph regression
        run: python tests/smoke_fft.py
      - name: FFT physical-frequency Hz and sample-rate UI regression
        run: python tests/smoke_fft_sample_rate.py
      - name: FFT frequency resolution, Nyquist and validation regression
        run: python tests/smoke_fft_frequency_metadata.py
      - name: FFT periodic Hann window, amplitude and UI regression
        run: python tests/smoke_fft_window.py
      - name: Python custom function composition regression
        run: python tests/smoke_python_compose.py
      - name: RK4 initial-value solver numeric and UI regression
        run: python tests/smoke_ode.py
      - name: Adaptive RK45 numerical and UI regression
        run: python tests/smoke_ode_adaptive.py
      - name: Coupled two-state RK4 reference and UI regression
